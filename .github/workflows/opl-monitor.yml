name: opl-monitor

on:
  schedule:
    - cron: "7,37 * * * *"      # twice an hour
  workflow_dispatch:             # manual run button in the Actions tab

permissions:
  contents: write

concurrency:
  group: opl-monitor
  cancel-in-progress: false

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          pip install playwright pandas openpyxl
          playwright install --with-deps chrome

      - name: Check for new cars
        env:
          TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: python opl_monitor3.py

      - name: Save state
        run: |
          git config user.name "opl-bot"
          git config user.email "opl-bot@users.noreply.github.com"
          git add opl_state.json 2>/dev/null || true
          git diff --cached --quiet || (git commit -m "update state" && git push)
